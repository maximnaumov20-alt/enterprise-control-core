services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecc
      POSTGRES_USER: ecc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ecc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecc -d ecc"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://ecc:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/ecc
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  bootstrap-admin:
    build: .
    command: ["python", "-m", "app.create_admin"]
    environment:
      DATABASE_URL: postgresql+psycopg://ecc:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/ecc
      ECC_ADMIN_EMAIL: ${ECC_ADMIN_EMAIL:?Set ECC_ADMIN_EMAIL in .env}
      ECC_ADMIN_PASSWORD: ${ECC_ADMIN_PASSWORD:?Set ECC_ADMIN_PASSWORD in .env}
      ECC_ADMIN_NAME: ${ECC_ADMIN_NAME:-ECC Administrator}
      ECC_ORGANIZATION_NAME: ${ECC_ORGANIZATION_NAME:-Default Organization}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://ecc:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/ecc
      ECC_SECRET_KEY: ${ECC_SECRET_KEY:?Set ECC_SECRET_KEY in .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-20}
      REDIS_URL: redis://redis:6379/0
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      bootstrap-admin:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # Loopback-only by default. Put a TLS-terminating reverse proxy in front.
      # Set ECC_FRONTEND_BIND_ADDRESS=0.0.0.0 only for a deliberately firewalled deployment.
      - "${ECC_FRONTEND_BIND_ADDRESS:-127.0.0.1}:${ECC_FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ecc-postgres-data:
