services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecc
      POSTGRES_USER: ecc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecc-local-development-only}
    volumes:
      - ecc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecc -d ecc"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://ecc:${POSTGRES_PASSWORD:-ecc-local-development-only}@db:5432/ecc
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ecc-postgres-data:
