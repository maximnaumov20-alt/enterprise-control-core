name: ECC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/requirements-dev.lock
          pip check

      - name: Compile Python files
        run: python -m compileall -q backend/app backend/tests

      - name: Run API tests
        working-directory: backend
        run: pytest -q

      - name: Verify database migrations
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/ecc-migration-test.db
        run: |
          alembic upgrade 0001_initial
          python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine("sqlite:////tmp/ecc-migration-test.db")
          with engine.begin() as connection:
              connection.execute(text("""
                  INSERT INTO assets
                      (name, asset_tag, category, status, created_at, updated_at)
                  VALUES
                      ('Legacy device', 'LEGACY-001', 'Laptop', 'active',
                       CURRENT_TIMESTAMP, CURRENT_TIMESTAMP)
              """))
          PY
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine("sqlite:////tmp/ecc-migration-test.db")
          with engine.connect() as connection:
              row = connection.execute(text(
                  "SELECT organization_id, asset_tag FROM assets WHERE asset_tag = 'LEGACY-001'"
              )).one()
              assert row.organization_id is not None
              assert row.asset_tag == "LEGACY-001"
          PY
          alembic current

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          sed -i \
            -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres-secret-1234567890/" \
            -e "s/^ECC_SECRET_KEY=.*/ECC_SECRET_KEY=ci-jwt-secret-1234567890-abcdefghijklmnopqrstuvwxyz/" \
            -e "s/^ECC_ADMIN_EMAIL=.*/ECC_ADMIN_EMAIL=ci-admin@example.com/" \
            -e "s/^ECC_ADMIN_PASSWORD=.*/ECC_ADMIN_PASSWORD=ci-admin-password-123456/" .env
          docker compose config --quiet
          docker compose config --format json | python -c '
          import json, sys
          config = json.load(sys.stdin)
          services = config["services"]
          frontend_ports = services["frontend"].get("ports", [])
          assert len(frontend_ports) == 1, f"Expected one published frontend port: {frontend_ports}"
          port = frontend_ports[0]
          assert (
              port.get("target") == 80
              and str(port.get("published")) == "5173"
              and port.get("host_ip") == "127.0.0.1"
          ), f"Frontend must bind to loopback by default: {frontend_ports}"
          for name in ("db", "migrate", "bootstrap-admin", "redis", "api"):
              published = services[name].get("ports", [])
              assert not published, f"{name} must not publish host ports: {published}"
          assert "8000" in services["api"].get("expose", []), "API must remain reachable on the private Compose network"
          assert services["frontend"].get("environment", {}).get("ECC_TRUSTED_PROXY_CIDRS", "") == "", "Trusted proxies must be opt-in"
          '

          rm .env

      - name: Build API image
        run: docker build --tag ecc-api:test .

      - name: Build frontend image
        run: docker build --tag ecc-frontend:test ./frontend

      - name: Verify trusted proxy allowlist and header handling
        run: |
          trusted_proxy_config=$(docker run --rm \
            -e ECC_TRUSTED_PROXY_CIDRS="10.20.0.0/16,192.0.2.10" \
            --entrypoint sh ecc-frontend:test -c '/docker-entrypoint.d/30-configure-trusted-proxies.sh && cat /etc/nginx/trusted-proxies.conf')
          printf '%s\n' "$trusted_proxy_config" | grep -Fx "set_real_ip_from 10.20.0.0/16;"
          printf '%s\n' "$trusted_proxy_config" | grep -Fx "set_real_ip_from 192.0.2.10;"
          if docker run --rm -e ECC_TRUSTED_PROXY_CIDRS="192.0.2.10/33" --entrypoint sh ecc-frontend:test -c '/docker-entrypoint.d/30-configure-trusted-proxies.sh'; then
            echo "IPv4 prefix above /32 was accepted" >&2
            exit 1
          fi
          if docker run --rm -e ECC_TRUSTED_PROXY_CIDRS="2001:db8::1/129" --entrypoint sh ecc-frontend:test -c '/docker-entrypoint.d/30-configure-trusted-proxies.sh'; then
            echo "IPv6 prefix above /128 was accepted" >&2
            exit 1
          fi
          for global_network in "0.0.0.0/0" "::/0" "192.0.2.0/0"; do
            if docker run --rm -e "ECC_TRUSTED_PROXY_CIDRS=$global_network" --entrypoint sh ecc-frontend:test -c '/docker-entrypoint.d/30-configure-trusted-proxies.sh'; then
              echo "Global /0 trusted-proxy network was accepted: $global_network" >&2
              exit 1
            fi
          done
          docker run --rm --entrypoint sh ecc-frontend:test -c \
            'grep -Fq "proxy_set_header X-Real-IP \$remote_addr;" /etc/nginx/conf.d/default.conf'
          if docker run --rm -e 'ECC_TRUSTED_PROXY_CIDRS=10.0.0.1;touch /tmp/pwned' --entrypoint sh ecc-frontend:test -c '/docker-entrypoint.sh nginx -t'; then
            echo "Unsafe trusted-proxy value was accepted" >&2
            exit 1
          fi

      - name: Run PostgreSQL Compose smoke test
        run: |
          sudo apt-get update
          sudo apt-get install --yes age
          age-keygen -o /tmp/ecc-ci-age-identity.txt
          chmod 600 /tmp/ecc-ci-age-identity.txt
          age_recipient=$(age-keygen -y /tmp/ecc-ci-age-identity.txt)
          cp .env.example .env
          sed -i \
            -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres-secret-1234567890/" \
            -e "s/^ECC_SECRET_KEY=.*/ECC_SECRET_KEY=ci-jwt-secret-1234567890-abcdefghijklmnopqrstuvwxyz/" \
            -e "s/^ECC_ADMIN_EMAIL=.*/ECC_ADMIN_EMAIL=ci-admin@example.com/" \
            -e "s/^ECC_ADMIN_PASSWORD=.*/ECC_ADMIN_PASSWORD=ci-admin-password-123456/" .env
          docker compose up --build --detach
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5173/health; then
              break
            fi
            sleep 2
          done
          curl --fail http://localhost:5173/health
          curl --fail http://localhost:5173/docs
          curl --fail http://localhost:5173/openapi.json
          curl --fail http://localhost:5173/
          curl --fail http://localhost:5173/health
          auth_status=$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:5173/api/v1/assets)
          test "$auth_status" = "401"

          admin_email=$(sed -n 's/^ECC_ADMIN_EMAIL=//p' .env)
          admin_password=$(sed -n 's/^ECC_ADMIN_PASSWORD=//p' .env)
          token=$(curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "username=$admin_email" \
            --data-urlencode "password=$admin_password" \
            http://localhost:5173/api/v1/auth/token | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')

          asset=$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d '{"name":"CI server","asset_tag":"CI-SRV-001","category":"Server"}' \
            http://localhost:5173/api/v1/assets)
          asset_id=$(printf '%s' "$asset" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          # Verify optimistic locking with two independent SQLAlchemy sessions on PostgreSQL.
          docker compose exec -T api python - "$asset_id" <<'PY'
          import sys
          from sqlalchemy.orm.exc import StaleDataError
          from app.main import Asset, SessionLocal

          asset_id = int(sys.argv[1])
          first = SessionLocal()
          second = SessionLocal()
          try:
              first_asset = first.get(Asset, asset_id)
              second_asset = second.get(Asset, asset_id)
              assert first_asset is not None and second_asset is not None
              assert first_asset.version == second_asset.version

              first_asset.name = "CI server updated by first transaction"
              first.commit()

              second_asset.name = "Stale concurrent overwrite"
              try:
                  second.commit()
              except StaleDataError:
                  second.rollback()
              else:
                  raise AssertionError("PostgreSQL accepted a stale concurrent asset update")

              with SessionLocal() as verify:
                  stored = verify.get(Asset, asset_id)
                  assert stored is not None
                  assert stored.name == "CI server updated by first transaction"
                  assert stored.version == first_asset.version
          finally:
              first.close()
              second.close()
          PY

          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d '{"name":"CI software","license_type":"subscription","seats_total":10,"seats_used":2}' \
            http://localhost:5173/api/v1/software-licenses

          maintenance=$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d "{\"asset_id\":$asset_id,\"title\":\"CI maintenance check\",\"description\":\"PostgreSQL integration smoke test\",\"priority\":\"normal\"}" \
            http://localhost:5173/api/v1/maintenance-requests)
          maintenance_id=$(printf '%s' "$maintenance" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d '{"status":"resolved"}' \
            "http://localhost:5173/api/v1/maintenance-requests/$maintenance_id"

          department=$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d '{"name":"CI Operations","code":"CI-OPS"}' \
            http://localhost:5173/api/v1/departments)
          department_id=$(printf '%s' "$department" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d "{\"employee_number\":\"CI-EMP-001\",\"full_name\":\"CI Employee\",\"department_id\":$department_id,\"email\":\"ci.employee@example.com\"}" \
            http://localhost:5173/api/v1/employees

          # Exercise the real PostgreSQL backup and restore scripts against CI data.
          backup_asset=$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d '{"name":"Backup baseline","asset_tag":"CI-BACKUP-001","category":"Server"}' \
            http://localhost:5173/api/v1/assets)
          backup_asset_id=$(printf '%s' "$backup_asset" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          ECC_BACKUP_DIR=/tmp/ecc-ci-backups ECC_BACKUP_AGE_RECIPIENT="$age_recipient" bash scripts/backup-postgres.sh
          backup_file=$(find /tmp/ecc-ci-backups -maxdepth 1 -type f -name 'ecc-postgres-*.dump.age' -print -quit)
          test -n "$backup_file"

          docker compose exec -T db psql -U ecc -d ecc -v ON_ERROR_STOP=1 \
            -c "UPDATE assets SET name='Changed after backup' WHERE id=$backup_asset_id"
          changed_name=$(docker compose exec -T db psql -U ecc -d ecc -Atqc \
            "SELECT name FROM assets WHERE id=$backup_asset_id")
          test "$changed_name" = "Changed after backup"

          ECC_BACKUP_AGE_IDENTITY=/tmp/ecc-ci-age-identity.txt ECC_RESTORE_CONFIRM=YES bash scripts/restore-postgres.sh "$backup_file"
          restored_name=$(docker compose exec -T db psql -U ecc -d ecc -Atqc \
            "SELECT name FROM assets WHERE id=$backup_asset_id")
          test "$restored_name" = "Backup baseline"

          docker compose exec -T api alembic current
          docker compose down --volumes

  shell-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        run: |
          bash -n scripts/backup-postgres.sh
          bash -n scripts/restore-postgres.sh
          bash -n scripts/upload-backup-s3.sh
          bash -n scripts/run-backup.sh
          sh -n frontend/docker-entrypoint.d/30-configure-trusted-proxies.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Lint maintenance scripts
        run: shellcheck --severity=warning scripts/backup-postgres.sh scripts/restore-postgres.sh scripts/upload-backup-s3.sh scripts/run-backup.sh frontend/docker-entrypoint.d/30-configure-trusted-proxies.sh

      - name: Test S3 uploader with a fake AWS CLI
        run: python scripts/tests/test_upload_backup_s3.py
