name: ECC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/requirements-dev.lock
          pip check

      - name: Compile Python files
        run: python -m compileall -q backend/app backend/tests

      - name: Run API tests
        working-directory: backend
        run: pytest -q

      - name: Verify database migrations
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/ecc-migration-test.db
        run: |
          alembic upgrade 0001_initial
          python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine("sqlite:////tmp/ecc-migration-test.db")
          with engine.begin() as connection:
              connection.execute(text("""
                  INSERT INTO assets
                      (name, asset_tag, category, status, created_at, updated_at)
                  VALUES
                      ('Legacy device', 'LEGACY-001', 'Laptop', 'active',
                       CURRENT_TIMESTAMP, CURRENT_TIMESTAMP)
              """))
          PY
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine("sqlite:////tmp/ecc-migration-test.db")
          with engine.connect() as connection:
              row = connection.execute(text(
                  "SELECT organization_id, asset_tag FROM assets WHERE asset_tag = 'LEGACY-001'"
              )).one()
              assert row.organization_id is not None
              assert row.asset_tag == "LEGACY-001"
          PY
          alembic current

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          sed -i \
            -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres-secret-1234567890/" \
            -e "s/^ECC_SECRET_KEY=.*/ECC_SECRET_KEY=ci-jwt-secret-1234567890-abcdefghijklmnopqrstuvwxyz/" \
            -e "s/^ECC_ADMIN_EMAIL=.*/ECC_ADMIN_EMAIL=ci-admin@example.com/" \
            -e "s/^ECC_ADMIN_PASSWORD=.*/ECC_ADMIN_PASSWORD=ci-admin-password-123456/" .env
          docker compose config --quiet
          docker compose config --format json | python -c '
          import json, sys
          config = json.load(sys.stdin)
          services = config["services"]
          frontend_ports = services["frontend"].get("ports", [])
          assert len(frontend_ports) == 1, f"Expected one published frontend port: {frontend_ports}"
          port = frontend_ports[0]
          assert (
              port.get("target") == 80
              and str(port.get("published")) == "5173"
              and port.get("host_ip") == "127.0.0.1"
          ), f"Frontend must bind to loopback by default: {frontend_ports}"
          for name in ("db", "migrate", "bootstrap-admin", "redis", "api"):
              published = services[name].get("ports", [])
              assert not published, f"{name} must not publish host ports: {published}"
          assert "8000" in services["api"].get("expose", []), "API must remain reachable on the private Compose network"
          assert services["frontend"].get("environment", {}).get("ECC_TRUSTED_PROXY_CIDRS", "") == "", "Trusted proxies must be opt-in"
          '

          rm .env

      - name: Build API image
        run: docker build --tag ecc-api:test .

      - name: Build frontend image
        run: docker build --tag ecc-frontend:test ./frontend

      - name: Verify trusted proxy allowlist and header handling
        run: |
          trusted_proxy_config=$(docker run --rm \
            -e ECC_TRUSTED_PROXY_CIDRS="10.20.0.0/16,192.0.2.10" \
            --entrypoint sh ecc-frontend:test -c '/docker-entrypoint.d/30-configure-trusted-proxies.sh && cat /etc/nginx/trusted-proxies.conf')
          printf '%s\n' "$trusted_proxy_config" | grep -Fx "set_real_ip_from 10.20.0.0/16;"
          printf '%s\n' "$trusted_proxy_config" | grep -Fx "set_real_ip_from 192.0.2.10;"
          if docker run --rm -e ECC_TRUSTED_PROXY_CIDRS="192.0.2.10/33" --entrypoint sh ecc-frontend:test -c '/docker-entrypoint.d/30-configure-trusted-proxies.sh'; then
            echo "IPv4 prefix above /32 was accepted" >&2
            exit 1
          fi
          if docker run --rm -e ECC_TRUSTED_PROXY_CIDRS="2001:db8::1/129" --entrypoint sh ecc-frontend:test -c '/docker-entrypoint.d/30-configure-trusted-proxies.sh'; then
            echo "IPv6 prefix above /128 was accepted" >&2
            exit 1
          fi
          for global_network in "0.0.0.0/0" "::/0" "192.0.2.0/0"; do
            if docker run --rm -e "ECC_TRUSTED_PROXY_CIDRS=$global_network" --entrypoint sh ecc-frontend:test -c '/docker-entrypoint.d/30-configure-trusted-proxies.sh'; then
              echo "Global /0 trusted-proxy network was accepted: $global_network" >&2
              exit 1
            fi
          done
          docker run --rm --entrypoint sh ecc-frontend:test -c \
            'grep -Fq "proxy_set_header X-Real-IP \$remote_addr;" /etc/nginx/conf.d/default.conf'
          if docker run --rm -e 'ECC_TRUSTED_PROXY_CIDRS=10.0.0.1;touch /tmp/pwned' --entrypoint sh ecc-frontend:test -c '/docker-entrypoint.sh nginx -t'; then
            echo "Unsafe trusted-proxy value was accepted" >&2
            exit 1
          fi

      - name: Run PostgreSQL Compose smoke test
        run: |
          sudo apt-get update
          sudo apt-get install --yes age
          age-keygen -o /tmp/ecc-ci-age-identity.txt
          chmod 600 /tmp/ecc-ci-age-identity.txt
          age_recipient=$(age-keygen -y /tmp/ecc-ci-age-identity.txt)
          cp .env.example .env
          sed -i \
            -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres-secret-1234567890/" \
            -e "s/^ECC_SECRET_KEY=.*/ECC_SECRET_KEY=ci-jwt-secret-1234567890-abcdefghijklmnopqrstuvwxyz/" \
            -e "s/^ECC_ADMIN_EMAIL=.*/ECC_ADMIN_EMAIL=ci-admin@example.com/" \
            -e "s/^ECC_ADMIN_PASSWORD=.*/ECC_ADMIN_PASSWORD=ci-admin-password-123456/" .env
          if ! docker compose up --build --detach; then
            docker compose logs --no-color migrate
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5173/health; then
              break
            fi
            sleep 2
          done
          curl --fail http://localhost:5173/health
          curl --fail http://localhost:5173/docs
          curl --fail http://localhost:5173/openapi.json
          curl --fail http://localhost:5173/
          curl --fail http://localhost:5173/health
          auth_status=$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:5173/api/v1/assets)
          test "$auth_status" = "401"

          admin_email=$(sed -n 's/^ECC_ADMIN_EMAIL=//p' .env)
          admin_password=$(sed -n 's/^ECC_ADMIN_PASSWORD=//p' .env)
          token=$(curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "username=$admin_email" \
            --data-urlencode "password=$admin_password" \
            http://localhost:5173/api/v1/auth/token | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')

          asset=$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d '{"name":"CI server","asset_tag":"CI-SRV-001","category":"Server"}' \
            http://localhost:5173/api/v1/assets)
          asset_id=$(printf '%s' "$asset" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          # Verify optimistic locking with two independent SQLAlchemy sessions on PostgreSQL.
          docker compose exec -T api python - "$asset_id" <<'PY'
          import sys
          from sqlalchemy.orm.exc import StaleDataError
          from app.main import Asset, SessionLocal

          asset_id = int(sys.argv[1])
          first = SessionLocal()
          second = SessionLocal()
          try:
              first_asset = first.get(Asset, asset_id)
              second_asset = second.get(Asset, asset_id)
              assert first_asset is not None and second_asset is not None
              assert first_asset.version == second_asset.version

              first_asset.name = "CI server updated by first transaction"
              first.commit()

              second_asset.name = "Stale concurrent overwrite"
              try:
                  second.commit()
              except StaleDataError:
                  second.rollback()
              else:
                  raise AssertionError("PostgreSQL accepted a stale concurrent asset update")

              with SessionLocal() as verify:
                  stored = verify.get(Asset, asset_id)
                  assert stored is not None
                  assert stored.name == "CI server updated by first transaction"
                  assert stored.version == first_asset.version
          finally:
              first.close()
              second.close()
          PY

          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d '{"name":"CI software","license_type":"subscription","seats_total":10,"seats_used":2}' \
            http://localhost:5173/api/v1/software-licenses

          maintenance=$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d "{\"asset_id\":$asset_id,\"title\":\"CI maintenance check\",\"description\":\"PostgreSQL integration smoke test\",\"priority\":\"normal\"}" \
            http://localhost:5173/api/v1/maintenance-requests)
          maintenance_id=$(printf '%s' "$maintenance" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          maintenance_version=$(printf '%s' "$maintenance" | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d "{\"expected_version\":$maintenance_version,\"status\":\"resolved\"}" \
            "http://localhost:5173/api/v1/maintenance-requests/$maintenance_id"

          department=$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d '{"name":"CI Operations","code":"CI-OPS"}' \
            http://localhost:5173/api/v1/departments)
          department_id=$(printf '%s' "$department" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          employee=$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d "{\"employee_number\":\"CI-EMP-001\",\"full_name\":\"CI Employee\",\"department_id\":$department_id,\"email\":\"ci.employee@example.com\"}" \
            http://localhost:5173/api/v1/employees)
          employee_id=$(printf '%s' "$employee" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          employee_version=$(printf '%s' "$employee" | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d "{\"expected_version\":$employee_version,\"job_title\":\"CI Systems Engineer\"}" \
            "http://localhost:5173/api/v1/employees/$employee_id"

          # Verify PostgreSQL optimistic locking for every versioned entity.
          docker compose exec -T api python - <<'PY'
          from sqlalchemy import select
          from sqlalchemy.orm.exc import StaleDataError
          from app.main import (
              Asset, Department, Employee, MaintenanceRequest, SessionLocal,
              SoftwareLicense, User,
          )

          cases = (
              (Asset, "name", "PostgreSQL asset first writer", "version"),
              (SoftwareLicense, "name", "PostgreSQL license first writer", "record_version"),
              (MaintenanceRequest, "title", "PostgreSQL maintenance first writer", "version"),
              (Department, "name", "PostgreSQL department first writer", "version"),
              (Employee, "full_name", "PostgreSQL employee first writer", "version"),
              (User, "full_name", "PostgreSQL user first writer", "version"),
          )

          with SessionLocal() as lookup:
              organization_id = lookup.scalar(select(User.organization_id).order_by(User.id))
              assert organization_id is not None

          for model, field, winning_value, version_field in cases:
              first = SessionLocal()
              second = SessionLocal()
              try:
                  statement = (
                      select(model)
                      .where(model.organization_id == organization_id)
                      .order_by(model.id)
                  )
                  first_row = first.scalars(statement).first()
                  second_row = second.scalars(statement).first()
                  assert first_row is not None and second_row is not None, model.__name__
                  row_id = first_row.id
                  assert getattr(first_row, version_field) == getattr(second_row, version_field)

                  setattr(first_row, field, winning_value)
                  first.commit()
                  winning_version = getattr(first_row, version_field)

                  setattr(second_row, field, "Stale concurrent overwrite")
                  try:
                      second.commit()
                  except StaleDataError:
                      second.rollback()
                  else:
                      raise AssertionError(
                          f"PostgreSQL accepted a stale {model.__name__} update"
                      )

                  with SessionLocal() as verify:
                      stored = verify.get(model, row_id)
                      assert stored is not None
                      assert getattr(stored, field) == winning_value
                      assert getattr(stored, version_field) == winning_version
              finally:
                  first.close()
                  second.close()
          PY

          # Verify PostgreSQL rolls back business data and its audit event atomically.
          docker compose exec -T api python - <<'PY'
          from sqlalchemy import select
          from sqlalchemy.exc import IntegrityError
          from app.main import Asset, AuditEvent, SessionLocal, User

          marker = "ci-postgres-rollback-audit-atomicity"
          with SessionLocal() as lookup:
              user = lookup.scalar(select(User).order_by(User.id))
              assert user is not None
              existing_asset = lookup.scalar(
                  select(Asset)
                  .where(Asset.organization_id == user.organization_id)
                  .order_by(Asset.id)
              )
              assert existing_asset is not None

          failed_asset_tag = "CI-ROLLBACK-ATOMIC-001"
          with SessionLocal() as transaction:
              transaction.add(Asset(
                  organization_id=user.organization_id,
                  name="Must be rolled back",
                  asset_tag=failed_asset_tag,
                  category="Server",
              ))
              transaction.add(AuditEvent(
                  organization_id=user.organization_id,
                  actor_user_id=user.id,
                  action=marker,
                  entity_type="asset",
                  entity_id=failed_asset_tag,
                  details={"test": "atomic rollback"},
              ))
              # A duplicate tenant-scoped asset tag forces the same transaction to fail.
              transaction.add(Asset(
                  organization_id=user.organization_id,
                  name="Duplicate tag trigger",
                  asset_tag=existing_asset.asset_tag,
                  category="Server",
              ))
              try:
                  transaction.commit()
              except IntegrityError:
                  transaction.rollback()
              else:
                  raise AssertionError("PostgreSQL accepted a duplicate tenant asset tag")

          with SessionLocal() as verify:
              assert verify.scalar(
                  select(Asset.id).where(
                      Asset.organization_id == user.organization_id,
                      Asset.asset_tag == failed_asset_tag,
                  )
              ) is None, "Business row survived a failed PostgreSQL transaction"
              assert verify.scalar(
                  select(AuditEvent.id).where(AuditEvent.action == marker)
              ) is None, "Audit event survived a failed PostgreSQL transaction"
          PY

          # Exercise the real PostgreSQL backup and restore scripts against CI data.
          backup_asset=$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d '{"name":"Backup baseline","asset_tag":"CI-BACKUP-001","category":"Server"}' \
            http://localhost:5173/api/v1/assets)
          backup_asset_id=$(printf '%s' "$backup_asset" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          backup_audit_id=$(docker compose exec -T db psql -U ecc -d ecc -Atqc \
            "SELECT id FROM audit_events WHERE action='asset.created' AND entity_type='asset' AND entity_id='$backup_asset_id' ORDER BY id DESC LIMIT 1")
          test -n "$backup_audit_id"

          ECC_BACKUP_DIR=/tmp/ecc-ci-backups ECC_BACKUP_AGE_RECIPIENT="$age_recipient" bash scripts/backup-postgres.sh
          backup_file=$(find /tmp/ecc-ci-backups -maxdepth 1 -type f -name 'ecc-postgres-*.dump.age' -print -quit)
          test -n "$backup_file"

          docker compose exec -T db psql -U ecc -d ecc -v ON_ERROR_STOP=1 \
            -c "UPDATE assets SET name='Changed after backup' WHERE id=$backup_asset_id"
          changed_name=$(docker compose exec -T db psql -U ecc -d ecc -Atqc \
            "SELECT name FROM assets WHERE id=$backup_asset_id")
          test "$changed_name" = "Changed after backup"
          docker compose exec -T db psql -U ecc -d ecc -v ON_ERROR_STOP=1 \
            -c "UPDATE audit_events SET action='ci.post_backup_mutation' WHERE id=$backup_audit_id"
          mutated_audit_action=$(docker compose exec -T db psql -U ecc -d ecc -Atqc \
            "SELECT action FROM audit_events WHERE id=$backup_audit_id")
          test "$mutated_audit_action" = "ci.post_backup_mutation"

          # Invalid archives must be rejected before pg_restore changes the target database.
          printf 'not a PostgreSQL archive\n' > /tmp/ecc-invalid-backup.dump
          if ECC_RESTORE_CONFIRM=YES bash scripts/restore-postgres.sh /tmp/ecc-invalid-backup.dump; then
            echo "Restore accepted an invalid PostgreSQL archive" >&2
            exit 1
          fi
          unchanged_name=$(docker compose exec -T db psql -U ecc -d ecc -Atqc \
            "SELECT name FROM assets WHERE id=$backup_asset_id")
          unchanged_audit_action=$(docker compose exec -T db psql -U ecc -d ecc -Atqc \
            "SELECT action FROM audit_events WHERE id=$backup_audit_id")
          test "$unchanged_name" = "Changed after backup"
          test "$unchanged_audit_action" = "ci.post_backup_mutation"

          if ECC_RESTORE_CONFIRM=YES bash scripts/restore-postgres.sh /tmp/ecc-file-that-does-not-exist.dump; then
            echo "Restore accepted a missing backup file" >&2
            exit 1
          fi
          if bash scripts/restore-postgres.sh "$backup_file"; then
            echo "Restore ran without explicit destructive-operation confirmation" >&2
            exit 1
          fi

          ECC_BACKUP_AGE_IDENTITY=/tmp/ecc-ci-age-identity.txt ECC_RESTORE_CONFIRM=YES bash scripts/restore-postgres.sh "$backup_file"
          restored_name=$(docker compose exec -T db psql -U ecc -d ecc -Atqc \
            "SELECT name FROM assets WHERE id=$backup_asset_id")
          test "$restored_name" = "Backup baseline"
          restored_audit_action=$(docker compose exec -T db psql -U ecc -d ecc -Atqc \
            "SELECT action FROM audit_events WHERE id=$backup_audit_id")
          test "$restored_audit_action" = "asset.created"

          # Download the encrypted object through a fake S3 endpoint, then restore it
          # into a separate Compose project with its own PostgreSQL volume.
          mkdir -p /tmp/ecc-fake-aws-bin /tmp/ecc-s3-restore-drill
          cat > /tmp/ecc-fake-aws-bin/aws <<'PY'
          #!/usr/bin/env python3
          import hashlib
          import json
          import os
          import pathlib
          import sys

          args = sys.argv[1:]
          source = pathlib.Path(os.environ["ECC_FAKE_S3_SOURCE"])
          payload = source.read_bytes()
          if args[:2] == ["s3api", "head-object"]:
              print(json.dumps({
                  "Metadata": {"sha256": hashlib.sha256(payload).hexdigest()},
                  "ContentLength": len(payload),
              }))
          elif args[:2] == ["s3", "cp"] and args[2].startswith("s3://"):
              pathlib.Path(args[3]).write_bytes(payload)
          else:
              print("unexpected fake AWS invocation: " + repr(args), file=sys.stderr)
              raise SystemExit(90)
          PY
          chmod 700 /tmp/ecc-fake-aws-bin/aws
          ECC_FAKE_S3_SOURCE="$backup_file" PATH="/tmp/ecc-fake-aws-bin:$PATH" \
            bash scripts/download-backup-s3.sh \
            s3://ecc-ci-bucket/restore-drill/backup.dump.age \
            /tmp/ecc-s3-restore-drill/backup.dump.age

          drill_project="ecc-restore-drill"
          trap 'COMPOSE_PROJECT_NAME="$drill_project" docker compose down --volumes --remove-orphans || true' EXIT
          COMPOSE_PROJECT_NAME="$drill_project" docker compose up --detach db
          for attempt in $(seq 1 30); do
            if COMPOSE_PROJECT_NAME="$drill_project" docker compose exec -T db pg_isready -U ecc -d ecc; then
              break
            fi
            sleep 2
          done
          COMPOSE_PROJECT_NAME="$drill_project" docker compose exec -T db pg_isready -U ecc -d ecc
          COMPOSE_PROJECT_NAME="$drill_project" ECC_BACKUP_AGE_IDENTITY=/tmp/ecc-ci-age-identity.txt \
            ECC_RESTORE_CONFIRM=YES bash scripts/restore-postgres.sh \
            /tmp/ecc-s3-restore-drill/backup.dump.age
          drill_restored_name=$(COMPOSE_PROJECT_NAME="$drill_project" docker compose exec -T db \
            psql -U ecc -d ecc -Atqc "SELECT name FROM assets WHERE id=$backup_asset_id")
          test "$drill_restored_name" = "Backup baseline"
          drill_audit_action=$(COMPOSE_PROJECT_NAME="$drill_project" docker compose exec -T db \
            psql -U ecc -d ecc -Atqc "SELECT action FROM audit_events WHERE id=$backup_audit_id")
          test "$drill_audit_action" = "asset.created"
          COMPOSE_PROJECT_NAME="$drill_project" docker compose down --volumes --remove-orphans
          trap - EXIT

          docker compose exec -T api alembic current
          docker compose down --volumes

  shell-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        run: |
          bash -n scripts/backup-postgres.sh
          bash -n scripts/restore-postgres.sh
          bash -n scripts/upload-backup-s3.sh
          bash -n scripts/run-backup.sh
          bash -n scripts/download-backup-s3.sh
          sh -n frontend/docker-entrypoint.d/30-configure-trusted-proxies.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Lint maintenance scripts
        run: shellcheck --severity=warning scripts/backup-postgres.sh scripts/restore-postgres.sh scripts/upload-backup-s3.sh scripts/run-backup.sh scripts/download-backup-s3.sh frontend/docker-entrypoint.d/30-configure-trusted-proxies.sh

      - name: Test S3 uploader with a fake AWS CLI
        run: python scripts/tests/test_upload_backup_s3.py

      - name: Test encrypted backup-cycle orchestration
        run: |
          python scripts/tests/test_run_backup.py
          python scripts/tests/test_download_backup_s3.py
          python scripts/tests/test_recovery_drill_report.py
