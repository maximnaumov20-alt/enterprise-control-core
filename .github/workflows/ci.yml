name: ECC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile Python files
        run: python -m compileall -q backend/app backend/tests

      - name: Run API tests
        working-directory: backend
        run: pytest -q

      - name: Verify database migrations
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/ecc-migration-test.db
        run: |
          alembic upgrade 0001_initial
          python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine("sqlite:////tmp/ecc-migration-test.db")
          with engine.begin() as connection:
              connection.execute(text("""
                  INSERT INTO assets
                      (name, asset_tag, category, status, created_at, updated_at)
                  VALUES
                      ('Legacy device', 'LEGACY-001', 'Laptop', 'active',
                       CURRENT_TIMESTAMP, CURRENT_TIMESTAMP)
              """))
          PY
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine("sqlite:////tmp/ecc-migration-test.db")
          with engine.connect() as connection:
              row = connection.execute(text(
                  "SELECT organization_id, asset_tag FROM assets WHERE asset_tag = 'LEGACY-001'"
              )).one()
              assert row.organization_id is not None
              assert row.asset_tag == "LEGACY-001"
          PY
          alembic current

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm .env

      - name: Build API image
        run: docker build --tag ecc-api:test .

      - name: Build frontend image
        run: docker build --tag ecc-frontend:test ./frontend

      - name: Run PostgreSQL Compose smoke test
        run: |
          cp .env.example .env
          docker compose up --build --detach
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5173/health; then
              break
            fi
            sleep 2
          done
          curl --fail http://localhost:5173/health
          curl --fail http://localhost:5173/docs
          curl --fail http://localhost:5173/openapi.json
          curl --fail http://localhost:5173/
          curl --fail http://localhost:5173/health
          auth_status=$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:5173/api/v1/assets)
          test "$auth_status" = "401"
          docker compose exec -T api alembic current
          docker compose down --volumes
