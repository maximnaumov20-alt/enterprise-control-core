name: Bootstrap frontend lockfile

on:
  push:
    branches: [main]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/frontend-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-lockfile-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve and generate npm lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate lockfile
        working-directory: frontend
        run: |
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion < 3 || !p.packages || !p.packages['']) process.exit(1)"
          npm ci --ignore-scripts

      - name: Open lockfile update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "build(frontend): add npm lockfile"
          branch: automation/frontend-lockfile
          delete-branch: true
          title: "build(frontend): add reproducible npm lockfile"
          body: |
            This pull request adds the npm lockfile generated by npm 10/Node.js 22 from the committed frontend/package.json.

            The workflow validates the lockfile with npm ci before opening this pull request. After review and merge, CI and the frontend Docker build can switch from npm install to npm ci.
          add-paths: frontend/package-lock.json
