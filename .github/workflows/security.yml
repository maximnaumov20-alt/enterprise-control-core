name: ECC Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, test/mfa-e2e-cleanup-hardening]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit

      - name: Audit locked Python requirements
        run: |
          pip-audit -r backend/requirements-runtime.lock
          pip-audit -r backend/requirements-dev.lock

  frontend-dependencies:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  container-images:
    name: Container image vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --tag ecc-api:security .

      - name: Build frontend image
        run: docker build --tag ecc-frontend:security ./frontend

      - name: Scan API image for unfixed high and critical vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:0.58.2 image \
            --scanners vuln \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            ecc-api:security

      - name: Scan frontend image for unfixed high and critical vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:0.58.2 image \
            --scanners vuln \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            ecc-frontend:security

      - name: Generate CycloneDX SBOMs for container images
        run: |
          mkdir -p sbom
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:v1.18.1 docker:ecc-api:security -o cyclonedx-json \
            > sbom/ecc-api.cdx.json
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:v1.18.1 docker:ecc-frontend:security -o cyclonedx-json \
            > sbom/ecc-frontend.cdx.json
          test -s sbom/ecc-api.cdx.json
          test -s sbom/ecc-frontend.cdx.json

      - name: Upload container SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ecc-container-sboms
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 30
