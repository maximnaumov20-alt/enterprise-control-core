name: MFA encrypted secret validation

on:
  push:
    branches: [feat/mfa-encrypted-secret-storage]
    paths:
      - "backend/app/mfa.py"
      - "backend/app/mfa_crypto.py"
      - "backend/tests/test_mfa_totp.py"
      - "backend/tests/test_mfa_crypto.py"
      - "backend/requirements-dev.lock"
      - ".github/workflows/mfa-crypto-validation.yml"

permissions:
  contents: read

jobs:
  mfa-crypto-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hash-locked development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/requirements-dev.lock
          pip check

      - name: Compile MFA modules
        run: python -m compileall -q backend/app/mfa.py backend/app/mfa_crypto.py backend/tests/test_mfa_totp.py backend/tests/test_mfa_crypto.py

      - name: Run TOTP and encryption tests
        working-directory: backend
        run: pytest -q tests/test_mfa_totp.py tests/test_mfa_crypto.py
