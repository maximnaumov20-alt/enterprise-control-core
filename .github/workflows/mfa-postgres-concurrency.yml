name: MFA PostgreSQL concurrency tests

on:
  pull_request:
    branches: [main, feat/mfa-frontend-flow]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-mfa-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecc
          POSTGRES_PASSWORD: ecc-test-password
          POSTGRES_DB: ecc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecc -d ecc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: backend
      ECC_TEST_POSTGRES_URL: postgresql+psycopg://ecc:ecc-test-password@localhost:5432/ecc_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/requirements-dev.lock
          pip check
      - name: Run PostgreSQL TOTP concurrency test
        run: pytest -q backend/tests/test_mfa_postgres_concurrency.py
      - name: Run expired MFA artifact cleanup tests
        run: pytest -q backend/tests/test_mfa_cleanup.py
