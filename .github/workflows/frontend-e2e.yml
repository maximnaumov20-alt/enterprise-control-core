name: Frontend browser E2E

on:
  pull_request:
    branches: [main, feat/mfa-frontend-flow]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ECC_ADMIN_EMAIL: e2e-admin@example.test
      ECC_ADMIN_PASSWORD: e2e-admin-password-123456
      ECC_E2E_BASE_URL: http://127.0.0.1:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start isolated PostgreSQL-backed application
        run: |
          cp .env.example .env
          sed -i \
            -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=e2e-postgres-secret-1234567890/" \
            -e "s/^ECC_SECRET_KEY=.*/ECC_SECRET_KEY=e2e-jwt-secret-1234567890-abcdefghijklmnopqrstuvwxyz/" \
            -e "s/^ECC_ADMIN_EMAIL=.*/ECC_ADMIN_EMAIL=$ECC_ADMIN_EMAIL/" \
            -e "s/^ECC_ADMIN_PASSWORD=.*/ECC_ADMIN_PASSWORD=$ECC_ADMIN_PASSWORD/" .env
          docker compose up --build --detach
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$ECC_E2E_BASE_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --no-color api frontend
          exit 1
      - name: Install frontend and browser-test dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Run browser end-to-end scenarios
        working-directory: frontend
        run: npx playwright test
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ecc-playwright-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated application
        if: always()
        run: docker compose down --volumes --remove-orphans
