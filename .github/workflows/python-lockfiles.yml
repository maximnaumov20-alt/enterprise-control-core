name: Python dependency lock verification

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/requirements-*.in"
      - "backend/requirements-*.lock"
      - ".github/workflows/python-lockfiles.yml"
      - ".github/workflows/python-dependency-locks.yml"
  push:
    branches: [main]
    paths:
      - "backend/requirements-*.in"
      - "backend/requirements-*.lock"
      - ".github/workflows/python-lockfiles.yml"

permissions:
  contents: read

jobs:
  verify-python-locks:
    name: Verify hashed Python lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pip-tools 7.5.1 accesses InstallRequirement.use_pep517, which was
      # removed in pip 25. Pin the last compatible pip release for this compiler.
      - name: Install compatible pip version
        run: python -m pip install --disable-pip-version-check "pip==24.3.1"

      - name: Verify generator uses the same compatible lock tooling
        run: |
          grep -Fq 'pip==24.3.1' .github/workflows/python-dependency-locks.yml
          grep -Fq 'pip-tools==7.5.1' .github/workflows/python-dependency-locks.yml

      - name: Install pinned lock compiler
        run: python -m pip install --disable-pip-version-check "pip-tools==7.5.1"

      - name: Regenerate runtime lock from declared inputs
        run: >-
          pip-compile
          --generate-hashes
          --resolver=backtracking
          --output-file=backend/requirements-runtime.lock
          backend/requirements-runtime.in

      - name: Regenerate development lock from declared inputs
        run: >-
          pip-compile
          --generate-hashes
          --resolver=backtracking
          --output-file=backend/requirements-dev.lock
          backend/requirements-dev.in

      # Normalize pip-tools' generated command metadata; the lock content and hashes remain untouched.
      - name: Normalize lockfile command metadata
        run: sed -i 's/ --no-index//' backend/requirements-runtime.lock backend/requirements-dev.lock

      - name: Reject stale or hand-edited lockfiles
        run: |
          git diff --check
          git diff --exit-code -- backend/requirements-runtime.lock backend/requirements-dev.lock

      - name: Verify clean hash-locked installation
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip check
